#
# User configuration for GEISA LEE conformance tests.
# Edit these values before launching a run.

# ================================== Overall  ===================================

# Applications under test. Separated by spaces defaults to the reference
# application when unset or empty.
APPLICATIONS="${APPLICATIONS:-${REFERENCE_APPLICATION}}"

# Command prefix for the host and container inspection that requires platform
# privilege, such as lxc-attach, lxc-info and reads of the host /proc, cgroup
# and mount state. Leave empty when the test account already has that access.
# The prefix must preserve the environment, as the LXC provisioner is
# configured through exported variables.
#
# Examples:
#   PRIVILEGED_COMMAND=""             test account already has access
#   PRIVILEGED_COMMAND="sudo -n -E"   passwordless sudo, environment preserved
#   PRIVILEGED_COMMAND="/usr/libexec/geisa-conformance-helper"
PRIVILEGED_COMMAND=""

# ============================ Application isolation ===========================

LXC_PATH="/platform/conformance/lxc"

# Absolute target-side paths for the LEE application and its LXC resources.
APPLICATION_MANIFEST_PATH="/platform/conformance/${REFERENCE_APPLICATION}-manifest.json"
BASE_LAYER_PATH="${LXC_PATH}/${REFERENCE_APPLICATION}/base"
APPLICATION_LAYER_PATH="${LXC_PATH}/${REFERENCE_APPLICATION}/application"
CONFIGURATION_LAYER_PATH="${LXC_PATH}/${REFERENCE_APPLICATION}/configuration"
UPPER_PATH="${LXC_PATH}/${REFERENCE_APPLICATION}/upper"
WORK_PATH="${LXC_PATH}/${REFERENCE_APPLICATION}/work"
ROOTFS_PATH="${LXC_PATH}/${REFERENCE_APPLICATION}/rootfs"
APPLICATION_IMAGE_PATH="${LXC_PATH}/${REFERENCE_APPLICATION}/packages/application.squashfs"
PERSISTENT_IMAGE_PATH="${LXC_PATH}/${REFERENCE_APPLICATION}/persistent.img"

# Reference application resource policy used when a value is absent from its manifest.
# These follow the principle of least privilege and are set to the minimum possible values.
REFERENCE_LXC_CPUSET_CPUS="0"
REFERENCE_LXC_CPUSET_MEMS="0"
REFERENCE_LXC_CPU_PERCENT="1"
REFERENCE_LXC_CPU_WEIGHT="1"
REFERENCE_LXC_MEMORY_KIB="1"
REFERENCE_LXC_PERSISTENT_KIB="0"
REFERENCE_LXC_NONPERSISTENT_KIB="0"

# Reference application (e.g: geisa-app) network setup.
# Re-configure these values to match the network configuration of your LXC bridge used for GEISA applications.
LXC_NETWORK_BRIDGE="lxcbr0"
LXC_NETWORK_GATEWAY="10.0.3.1"
LXC_NETWORK_PREFIX="24"

# Base image supplied to applications. Set CONTAINER_BASE_IMAGE to select
# one file, or leave it empty to use the newest matching file.
CONTAINER_BASE_IMAGE=""
CONTAINER_BASE_IMAGE_DIR="/platform/base"
CONTAINER_BASE_IMAGE_GLOB="geisa-application-base-*.rootfs.squashfs"
CONTAINER_IMAGE_FSTYPE="squashfs"
CONTAINER_PERSISTENT_FSTYPE="ext4"
