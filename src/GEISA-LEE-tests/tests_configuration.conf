# Conformance tests installation
CONFIGURATION_FILE=true

# Reference application
REFERENCE_APPLICATION="geisa-simple"

# Resolve the host-side LXC resources of one application and export them for
# the reference provisioner, which reads its configuration from the environment.
export_application_layout() {
	BASE_LAYER_PATH="$(layout_base_layer_path "$1")"
	APPLICATION_LAYER_PATH="$(layout_application_layer_path "$1")"
	CONFIGURATION_LAYER_PATH="$(layout_configuration_layer_path "$1")"
	UPPER_PATH="$(layout_upper_path "$1")"
	WORK_PATH="$(layout_work_path "$1")"
	ROOTFS_PATH="$(layout_rootfs_path "$1")"
	APPLICATION_IMAGE_PATH="$(layout_application_image_path "$1")"
	PERSISTENT_IMAGE_PATH="$(layout_persistent_image_path "$1")"
	export BASE_LAYER_PATH APPLICATION_LAYER_PATH CONFIGURATION_LAYER_PATH
	export UPPER_PATH WORK_PATH ROOTFS_PATH APPLICATION_IMAGE_PATH PERSISTENT_IMAGE_PATH
}
