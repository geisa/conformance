# This test suite does not belong to any new sub-chapter, but it rather groups together
# all tests that require a reboot to be performed last. The intended purpose is to allow test users
# to run as many tests as possible before a reboot is required.
#
# The launcher only copies this file to the board once it has reset it, so the
# tests below never run before the reboot they depend on. Pass --no-reboot to
# skip the reset and leave this suite out of the run entirely.
if [ -z "${GLEE_TESTS}" ] || echo "${GLEE_TESTS}" | grep -Eq "(^| )reboot($| )"; then
	logging suite "GEISA LEE - Base Filesystem"
	cukinia_log "$(_colorize blue "--- GEISA LEE - Base Filesystem (reboot) ---")"

	# ==================================== MUST ====================================

	. "$LEE_TESTS_DIR/tests.d/check-container.sh"

	privileged_test_id "GEISA-LEE-FS-MUST-43" \
	as "/home/geisa MUST be persistent across device reboots." \
	cukinia_cmd check_container_reboot_persistence

	# =================================== SHALL ====================================

	# =================================== SHOULD ===================================

	# ==================================== MAY =====================================
fi
