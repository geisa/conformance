if [ -z "${GLEE_TESTS}" ] || echo "${GLEE_TESTS}" | grep -Eq "(^| )file_layout($| )"; then
	logging suite "GEISA LEE - Base Filesystem"
	cukinia_log "$(_colorize blue "--- GEISA LEE - Base Filesystem ---")"

	# ==================================== MUST ====================================

	. "$LEE_TESTS_DIR/tests.d/check-container.sh"

	test_index=1

	# Cache the expected filesystem layout for all containers in a single file to avoid repeated checks
	skeleton_directories="bin dev etc home lib proc sys tmp var"
	skeleton_files="etc/group etc/hostname etc/hosts etc/passwd"
	required_device_nodes="console full log null random stderr stdin stdout urandom zero"
	filesystem_checks=""
	for dir in $skeleton_directories; do
		filesystem_checks="${filesystem_checks} d:/$dir"
	done
	for file in $skeleton_files; do
		filesystem_checks="${filesystem_checks} f:/$file"
	done
	for node in $required_device_nodes; do
		filesystem_checks="${filesystem_checks} e:/dev/$node"
	done
	file_layout_checks="$filesystem_checks hosts-localhost d:$CONTAINER_PERSISTENT_MOUNT d:/ proc-mounted dev-mounted sys-mounted tmp-writable root-read-only"
	for variable in SHELL HOME USER PATH; do
		file_layout_checks="${file_layout_checks} V:$variable"
	done

	for dir in $skeleton_directories; do
	    privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	    as "A skeleton filesystem MUST be populated including typical paths for binaries and libraries (/$dir)." \
	    cukinia_cmd check_all_containers_file_layout_entry \
	        "$file_layout_checks" "d:/$dir"
	    test_index=$((test_index + 1))
	done

	for file in $skeleton_files; do
	    privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	    as "A skeleton filesystem MUST be populated with typical files including at a minimum (/$file)." \
	    cukinia_cmd check_all_containers_file_layout_entry \
	        "$file_layout_checks" "f:/$file"
	    test_index=$((test_index + 1))
	done

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "A skeleton filesystem MUST be populated with typical files including at a minimum (/etc/hosts including a localhost entry)." \
	cukinia_cmd check_all_containers_file_layout_entry \
	    "$file_layout_checks" hosts-localhost
	test_index=$((test_index + 1))

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "The GEISA platform implementation MUST provide the following virtual filesystem mounts within the container environment (/home/geisa)." \
	cukinia_cmd check_all_containers_file_layout_entry \
	    "$file_layout_checks" "d:$CONTAINER_PERSISTENT_MOUNT"
	test_index=$((test_index + 1))

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "The GEISA platform implementation MUST provide the following virtual filesystem mounts within the container environment (/)." \
	cukinia_cmd check_all_containers_file_layout_entry \
	    "$file_layout_checks" d:/
	test_index=$((test_index + 1))

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "Each GEISA Application MUST be provisioned in its own container environment separate from other Applications." \
	cukinia_cmd check_containers_are_isolated
	test_index=$((test_index + 1))

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "The GEISA platform implementation MUST provide the following virtual filesystem mount within the container environment (/proc)." \
	cukinia_cmd check_all_containers_file_layout_entry \
	    "$file_layout_checks" proc-mounted
	test_index=$((test_index + 1))

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "The GEISA platform implementation MUST provide the following virtual filesystem mount within the container environment (/dev)." \
	cukinia_cmd check_all_containers_file_layout_entry \
	    "$file_layout_checks" dev-mounted
	test_index=$((test_index + 1))

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "The GEISA platform implementation MUST provide the following virtual filesystem mount within the container environment (/sys)." \
	cukinia_cmd check_all_containers_file_layout_entry \
	    "$file_layout_checks" sys-mounted
	test_index=$((test_index + 1))

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "The GEISA platform implementation MUST provide the following virtual filesystem mount within the container environment (/tmp)." \
	cukinia_cmd check_all_containers_file_layout_entry \
	    "$file_layout_checks" tmp-writable
	test_index=$((test_index + 1))

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "The root filesystem MUST be mounted read-only, or the application MUST lack write permission outside the writable paths." \
	cukinia_cmd check_container_root_policy
	test_index=$((test_index + 1))

	when "is_any_container_root_read_write" \
	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "If the root filesystem is read-write, the platform MUST enforce file and directory permissions appropriately." \
	cukinia_cmd check_container_read_write_permissions
	test_index=$((test_index + 1))

	when "is_any_container_root_read_write" \
	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "If the root filesystem is read-write, the platform MUST limit its growable size to the manifest non-persistent storage limit." \
	cukinia_cmd check_container_read_write_size
	test_index=$((test_index + 1))

	for node in $required_device_nodes; do
	    privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	    as "/dev MUST contain at a minimum ($node)." \
	    cukinia_cmd check_all_containers_file_layout_entry \
	        "$file_layout_checks" "e:/dev/$node"
	    test_index=$((test_index + 1))
	done

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "/dev/log MUST be backed by the platform to filter and direct logs into the platform logging mechanism." \
	cukinia_cmd check_container_logging
	test_index=$((test_index + 1))

	required_environment_variables="SHELL HOME USER PATH"
	for variable in $required_environment_variables; do
	    privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	    as "The following environment variable MUST be set when invoking Application processes ($variable)." \
	    cukinia_cmd check_all_containers_file_layout_entry \
	        "$file_layout_checks" "V:$variable"
	    test_index=$((test_index + 1))
	done

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "/tmp MUST be limited in size as described in the Application Deployment Manifest." \
	cukinia_cmd check_container_mount_limit "$CONTAINER_NONPERSISTENT_MOUNT" nonpersistent
	test_index=$((test_index + 1))

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "/home/geisa MUST be limited in size as described in the Application Deployment Manifest." \
	cukinia_cmd check_container_mount_limit "$CONTAINER_PERSISTENT_MOUNT" persistent
	test_index=$((test_index + 1))

	privileged_test_id "GEISA-LEE-FS-MUST-$(printf '%02d' "$test_index")" \
	as "/home/geisa MUST be persistent across application restarts." \
	cukinia_cmd check_container_restart_persistence
	test_index=$((test_index + 1))

	test_index=$((test_index + 1))

	# =================================== SHALL ====================================
	privileged_test_id "GEISA-LEE-FS-SHALL-$(printf '%02d' "$test_index")" \
	as "Platform SHALL be responsible for metadata integrity (filesystem integrity mechanism)." \
	cukinia_cmd check_container_persistent_journaling
	test_index=$((test_index + 1))

	# =================================== SHOULD ===================================

	# ==================================== MAY =====================================
fi
