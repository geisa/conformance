CUKINIA_DIR=$(dirname "$(realpath "$0")")
LEE_TESTS_DIR=$(dirname "$CUKINIA_DIR")/GEISA-LEE-tests

cukinia_log "$(_colorize white2 "--- GEISA LEE conformance tests ---")"

. $LEE_TESTS_DIR/tests_configuration.conf
. $LEE_TESTS_DIR/user_configuration.conf
. $LEE_TESTS_DIR/tests.d/check-container.sh

# A test account without host inspection rights fails the privileged checks for
# reasons unrelated to platform conformance. Report that as a setup error
# instead of letting it count as non-conformance.
if ! check_privileged_access; then
	cukinia_log "$(_colorize red "Setup error: this account cannot inspect host and container state.")"
	cukinia_log "Set PRIVILEGED_COMMAND in user_configuration.conf, for example \"sudo -n -E\"."
	exit 2
fi

verbose cukinia_conf_include $LEE_TESTS_DIR/tests.d/*.conf

cukinia_log "GEISA LEE conformance tests: ran $cukinia_tests tests, $(_colorize red "$cukinia_failures failed"), $(_colorize yellow2 "$cukinia_skip skipped")"
