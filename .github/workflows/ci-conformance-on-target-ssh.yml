name: Reusable workflow for ssh testing

on:
  workflow_call:
    inputs:
        runner:
          required: true
          type: string
        user:
          type: string
          required: false
          default: 'root'
    secrets:
        target_ip:
          required: true
        target_password:
          required: false

jobs:
    on-target-test-ssh:
        runs-on: ${{inputs.runner}}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                ref: ${{ github.event.pull_request.head.sha || github.sha }}
                submodules: true
                persist-credentials: false
                # Allow unsafe checkout as secrets used in the workflow are
                # required to validate the PR changes.
                # But an approval job is set to wait for a maintainer to allow
                # the run of this workflow, giving the time to review the PR
                # changes before running this workflow.
                allow-unsafe-pr-checkout: true
            - name: copy template file for launch_gapi_test_app.sh
              run: cp launch_gapi_test_app.sh.template launch_gapi_test_app.sh
            - name: Run on target tests with report generation using ssh
              run: |
                set +e
                cqfd init
                cqfd run ./launch_conformance_tests.sh \
                    --ip ${{secrets.target_ip}} \
                    --user ${{ inputs.user }} \
                    ${{ secrets.target_password && format('--password "{0}"', secrets.target_password) }}

                if [[ $? -ne 0 ]]; then
                    grep -q "FAIL" reports/*.xml
                    if [[ $? -ne 0 ]]; then
                        echo "Conformance test execution failed"
                        exit 1
                    fi
                fi
            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: geisa-conformance-report-ssh-${{inputs.runner}}
                  path: reports/geisa-conformance-report.pdf
                  if-no-files-found: error
            - name: Upload tests xml
              if: always()
              uses: dorny/test-reporter@v3
              with:
                name: SSH Tests
                path: reports/*.xml
                reporter: jest-junit
                fail-on-error: false
            - name: Run on target tests without report generation using ssh
              run: |
                output_file="$(mktemp)"
                set +e

                cqfd init
                cqfd run ./launch_conformance_tests.sh \
                    --ip ${{secrets.target_ip}} \
                    --user ${{ inputs.user }} \
                    ${{ secrets.target_password && format('--password "{0}"', secrets.target_password) }} \
                    --no-reports >"${output_file}" 2>&1
                test_status=$?

                set -e
                cat "${output_file}"
                if [[ ${test_status} -ne 0 ]] && ! grep -Fq '[FAIL]' "${output_file}"; then
                    rm -f "${output_file}"
                    echo "Conformance test execution failed"
                    exit "${test_status}"
                fi
                rm -f "${output_file}"
            - name: Test selecting GLEE tests to run
              run: |
                output_file="$(mktemp)"
                set +e

                cqfd init
                GLEE_TESTS="basic_hardware_tests os_requirements_tests" \
                cqfd run ./launch_conformance_tests.sh \
                    --ip ${{secrets.target_ip}} \
                    --user ${{inputs.user}} \
                    ${{ secrets.target_password && format('--password "{0}"', secrets.target_password) }} \
                    --no-reports >"${output_file}" 2>&1
                test_status=$?

                set -e
                cat "${output_file}"
                if [[ ${test_status} -ne 0 ]] && ! grep -Fq '[FAIL]' "${output_file}"; then
                    rm -f "${output_file}"
                    echo "Conformance test execution failed"
                    exit "${test_status}"
                fi
                rm -f "${output_file}"
